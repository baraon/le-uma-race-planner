# Production stack for a single small server:
#   docker compose -f compose.prod.yaml up -d --build
# Needs a filled-in .env next to this file (see .env.example). Postgres is not exposed publicly.

name: le-uma-race-planner

# Container logs rotate (3 × 10 MB per service) instead of growing without limit.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        # Shown by /api/health; the deploy command passes the git commit.
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      APP_URL: ${APP_URL:?set APP_URL in .env}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
      RUN_MIGRATIONS: 'true'
    depends_on:
      db:
        condition: service_healthy

  # Caddy serves the built frontend and proxies /api and /auth. With a real domain in
  # SITE_ADDRESS it fetches and renews HTTPS certificates automatically.
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    logging: *logging
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
